name: Build AlexRetro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Download project and emulator cores
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Fire TV APK with bundled cores
        run: ./gradlew :lemuroid-app:assembleFreeBundleDebug --no-daemon --stacktrace

      - name: Save AlexRetro APK
        uses: actions/upload-artifact@v4
        with:
          name: AlexRetro-FireTV-bundled-APK
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
          retention-days: 14
