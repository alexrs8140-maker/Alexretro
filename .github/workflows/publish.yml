name: Build AlexRetro APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Download project and emulator cores
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK found at $ANDROID_HOME"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Fire TV APK with bundled cores
        run: ./gradlew :lemuroid-app:assembleFreeBundleDebug --no-daemon --stacktrace

      - name: Save AlexRetro APK
        uses: actions/upload-artifact@v4
        with:
          name: AlexRetro-FireTV-bundled-APK
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct-download APK
        run: |
          cp lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk AlexRetro-FireTV.apk

      - name: Publish APK for Fire TV Downloader
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view alexretro-firetv >/dev/null 2>&1; then
            gh release upload alexretro-firetv AlexRetro-FireTV.apk --clobber
          else
            gh release create alexretro-firetv AlexRetro-FireTV.apk \
              --title "AlexRetro Fire TV APK" \
              --notes "Debug build for personal Fire TV testing. Download the APK directly from the release assets." \
              --target "$GITHUB_SHA"
          fi

  publish-tested-apk:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/fire-tv-folder-picker'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download successful Build 10
        uses: actions/download-artifact@v4
        with:
          name: AlexRetro-FireTV-bundled-APK
          run-id: 42262129911
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Publish tested APK for Downloader
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find tested-apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" AlexRetro-FireTV.apk
          sha256sum AlexRetro-FireTV.apk > AlexRetro-FireTV.apk.sha256
          if ! gh release view alexretro-test-5c736349 >/dev/null 2>&1; then
            gh release create alexretro-test-5c736349 \
              --target 5c736349c1d21514f44c821f7914eb5deb1dee68 \
              --prerelease --title "AlexRetro Fire TV — custom artwork and folder fix" \
              --notes "Successful Build 10. Includes bundled cores, custom AlexRetro artwork, and Fire TV folder picker fixes. Personal test build; device testing still required."
          fi
          gh release upload alexretro-test-5c736349 AlexRetro-FireTV.apk AlexRetro-FireTV.apk.sha256 --clobber
