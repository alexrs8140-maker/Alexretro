name: Build AlexRetro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build test APK
        run: bash ./gradlew :lemuroid-app:assembleFreeDynamicDebug --no-daemon --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AlexRetro-test-APK
          path: lemuroid-app/build/outputs/apk/freeDynamic/debug/*.apk
          if-no-files-found: error
          retention-days: 7
